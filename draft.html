<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol Draft | Fatih Aydın</title>
    <!-- Sitelerin fotoğrafları engellemesini durduran kod -->
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Sadece Draft Sayfasına Özel Stiller */
        body { background-color: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; text-align: center; }
        
        /* Kurulum Ekranı */
        #setup-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; width: 300px; text-align: left;}
        .input-group input, .input-group select { padding: 12px; border-radius: 6px; border: 1px solid #64ffda; background: #1e1e1e; color: #fff; }
        .btn { padding: 12px 24px; background-color: #64ffda; color: #121212; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background-color: #4cd8b8; }

        /* Oyun Ekranı */
        #game-screen { display: none; }
        .team-header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .team-logo { width: 80px; height: 80px; border-radius: 50%; background-color: #1e1e1e; border: 2px solid #64ffda; }
        
        /* Saha */
        .pitch-container { position: relative; }
        .manager-spot { position: absolute; top: 10px; left: 10px; width: 90px; height: 120px; background: rgba(0,0,0,0.6); border: 2px dashed #ff9800; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #ff9800; font-weight: bold; }
        .pitch { background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 100%); width: 100%; max-width: 800px; height: 700px; margin: 0 auto; border: 5px solid #fff; border-radius: 10px; display: flex; flex-direction: column; justify-content: space-evenly; box-shadow: 0 10px 30px rgba(0,0,0,0.5); padding: 20px 0; }
        .row { display: flex; justify-content: center; gap: 30px; width: 100%; }
        
        /* Kart Tasarımı */
        .card-spot { width: 95px; height: 140px; background: rgba(0,0,0,0.5); border: 2px dashed rgba(255,255,255,0.5); border-radius: 8px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
        .card-spot:hover { transform: scale(1.05); border-color: #64ffda; }
        .card-spot .plus { font-size: 2rem; color: rgba(255,255,255,0.5); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .card-spot .pos-label { position: absolute; bottom: 5px; width: 100%; text-align: center; font-size: 0.8rem; font-weight: bold; color: #aaa; }
        
        /* Dolu Kart */
        /* Dolu Kart - Dışarıdan resim çekmek yerine CSS ile altın rengi degrade yapıyoruz */
        .card-spot.filled { 
            border: 2px solid #fff; 
            background: linear-gradient(135deg, #d4af37 0%, #aa7700 100%); 
        }
        .card-spot.filled .plus, .card-spot.filled .pos-label { display: none; }
        .card-img { width: 100%; height: 60%; object-fit: contain; margin-top: 10px; }
        .card-ovr { position: absolute; top: 5px; left: 8px; font-weight: bold; font-size: 1.2rem; color: #fff; }
        .card-flag { position: absolute; top: 30px; left: 10px; width: 16px; height: 11px; }
        .card-name { position: absolute; bottom: 15px; width: 100%; text-align: center; font-weight: bold; font-size: 0.75rem; color: #fff; text-transform: uppercase; }
        
        /* Modal Seçim Ekranı */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); }
        .modal-content { background-color: #1e1e1e; margin: 5% auto; padding: 20px; border: 1px solid #64ffda; width: 90%; max-width: 800px; border-radius: 8px; text-align: center; }
        .close-btn { color: #aaa; float: right; font-size: 28px; cursor: pointer; }
        .choices-container { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        
        .choice-card { width: 120px; height: 180px; background: #222; border: 2px solid #444; border-radius: 8px; cursor: pointer; position: relative; transition: 0.3s; }
        .choice-card:hover { border-color: #64ffda; transform: translateY(-10px); }
        .choice-card img { width: 100%; height: 60%; object-fit: contain; margin-top: 10px; }
        .choice-card .ovr { position: absolute; top: 5px; left: 5px; font-weight: bold; font-size: 1.2rem; }
        .choice-card .flag { position: absolute; top: 30px; left: 5px; width: 20px; }
        .choice-card .name { position: absolute; bottom: 10px; width: 100%; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. KURULUM EKRANI -->
    <div id="setup-screen">
        <h1>Fatih's Futbol Draft</h1>
        <div class="input-group">
            <label>Takım İsmi:</label>
            <input type="text" id="team-name" placeholder="Örn: Galaktikos FC">
        </div>
        <div class="input-group">
            <label>Diziliş Seç:</label>
            <select id="formation">
                <option value="4-3-3">4-3-3 (Hücum)</option>
                <option value="4-4-2">4-4-2 (Klasik)</option>
                <option value="3-5-2">3-5-2 (Kontrol)</option>
            </select>
        </div>
        <button class="btn" onclick="startDraft()">Draft'ı Başlat</button>
    </div>

    <!-- 2. OYUN EKRANI -->
    <div id="game-screen">
        <div class="team-header">
            <img id="team-logo" class="team-logo" src="" alt="Team Logo">
            <h2 id="display-team-name">Takım Adı</h2>
        </div>
        
        <div class="pitch-container">
            <div class="manager-spot" onclick="openModal('Manager', this)">
                <span>T. Direktör</span>
                <div class="plus">+</div>
            </div>
            <div id="pitch" class="pitch">
                <!-- Saha içi JS ile dinamik çizilecek -->
            </div>
        </div>
    </div>
</div>

<!-- 3. OYUNCU/MENAJER SEÇİM MODALI -->
<div id="playerModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2>Seçimini Yap: <span id="modal-position"></span></h2>
        <div id="choices-container" class="choices-container">
            <!-- 5 Rastgele Kart Buraya Gelecek -->
        </div>
    </div>
</div>

<script src="draft.js"></script>
</body>
</html>
